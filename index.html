<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/script.js" defer></script>

    <title>Super Mario</title>
</head>

<body>
    <div class="game-board">
        <img src="./images/clouds.png" class="clouds">
        <img src="./images/mario.gif" class="mario">
        <img src="./images/pipe.png" alt="tubo" class="pipe">
        <span class="score">0</span>  
        <div class="start-screen">
            <p class="game-title">SUPER MARIO</p>
            <button class="play-button" type="button" aria-label="Começar o jogo">▶ JOGAR</button>
        </div>
    </div>

    <div class="jukebox" aria-label="Jukebox">
        <span class="jukebox-label">♫ JUKEBOX</span>
        <select class="track-select" aria-label="Escolher música">
            <option value="soundtrack/Super Mario Bros. Theme Song (320 kbps).mp3">Super Mario Theme</option>
            <option value="soundtrack/JackBlack_Peaches.mp3">Peaches</option>
        </select>
        <button class="music-toggle" type="button" aria-label="Tocar música">▶</button>
    </div>

    <audio id="myAudio" src="soundtrack/Super Mario Bros. Theme Song (320 kbps).mp3" loop preload="metadata">
        Seu navegador não suporta o elemento de áudio.
    </audio>

</body>
</html>
